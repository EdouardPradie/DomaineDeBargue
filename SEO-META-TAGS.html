<!-- 
Domaine de Bargue - SEO & Meta Tags Guide

This file documents the meta tags and SEO optimizations used in the website.
Update these values in the <head> section of index.html as needed.
-->

<!-- ESSENTIAL META TAGS -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Domaine de Bargue - Experience authentic French wine and countryside hospitality">
<meta name="keywords" content="wine, domain, france, wine tasting, accommodation, events">
<meta name="author" content="Domaine de Bargue">

<!-- OPEN GRAPH (For Social Media Sharing) -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://domainedebargues.com/">
<meta property="og:title" content="Domaine de Bargue - French Wine & Hospitality">
<meta property="og:description" content="Experience authentic French wine and countryside hospitality at Domaine de Bargue">
<meta property="og:image" content="https://domainedebargues.com/images/og-image.jpg">
<meta property="og:locale" content="en_US">

<!-- TWITTER CARD -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:url" content="https://domainedebargues.com/">
<meta name="twitter:title" content="Domaine de Bargue - French Wine & Hospitality">
<meta name="twitter:description" content="Experience authentic French wine and countryside hospitality at Domaine de Bargue">
<meta name="twitter:image" content="https://domainedebargues.com/images/twitter-card.jpg">

<!-- FAVICON -->
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- CANONICAL URL (Prevents duplicate content issues) -->
<link rel="canonical" href="https://domainedebargues.com/">

<!-- ROBOTS & INDEXING -->
<meta name="robots" content="index, follow">
<meta name="language" content="English">
<meta name="revisit-after" content="7 days">

<!-- GOOGLE & BING VERIFICATION (Optional) -->

<!-- STRUCTURED DATA (Schema.org) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "name": "Domaine de Bargue",
  "description": "French wine domain offering tastings, accommodation, and events",
  "url": "https://domainedebargues.com",
  "telephone": "+33-3-XXXX-XXXX",
  "email": "info@domainedebargue.com",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "Domaine de Bargue",
    "addressLocality": "Burgundy",
    "addressCountry": "FR"
  },
  "image": "https://domainedebargues.com/images/logo.jpg",
  "sameAs": [
    "https://www.facebook.com/domainedebargue",
    "https://www.instagram.com/domainedebargue",
    "https://twitter.com/domainedebargue"
  ]
}
</script>

<!-- PERFORMANCE & ACCESSIBILITY -->
<meta name="theme-color" content="#01263f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- PRECONNECT TO EXTERNAL RESOURCES -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- DNS PREFETCH FOR THIRD-PARTY SERVICES -->
<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<link rel="dns-prefetch" href="https://fonts.gstatic.com">
